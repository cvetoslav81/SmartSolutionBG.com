<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ org_name }}</title>

  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <style>
    :root {
      --sa-primary: {{ org_primary }};
      --sa-accent: {{ org_accent }};
    }
  </style>

  <script>
    if (navigator.userAgent.includes('SolarAssistant')) {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('embedded')
      })
    }
  </script>
</head>

<body>

  <header class="site-header hide-android">
    <div class="header-inner">

      <a class="header-logo" href="/sign_in">
        <img
          src="/assets/logo.svg"
          alt="{{ org_name }}"
        />
      </a>

    </div>
  </header>

  <main class="centered">

    <h1>Създаване на акаунт</h1>

    <p style="
      margin-bottom:8px;
      font-size:15px;
      color:#6b7280;
      text-align:center;
    ">
      Регистрирайте се за достъп до вашата фотоволтаична система
    </p>

    <p style="
      margin-top:0;
      margin-bottom:20px;
      font-size:14px;
      text-align:center;
    ">

      <a
        href="https://www.smartsolutionbg.com/solarassistant.html"
        target="_blank"
        rel="noopener noreferrer"
        style="
          color:var(--sa-primary);
          text-decoration:none;
          font-weight:600;
        "
      >
        от SmartSolutionBG.com →
      </a>

    </p>

    <div id="sa-register-container"></div>

    <p style="
      margin-top:16px;
      font-size:14px;
      color:#6b7280;
    ">
      Вече имате акаунт?

      <a
        href="/sign_in"
        style="
          color:var(--sa-primary);
          text-decoration:none;
        "
      >
        Влезте тук
      </a>
    </p>

  </main>

      addMessages,
      setLocale

      register_site: 'Регистрирай система',
      failed_register: 'Системата не можа да бъде регистрирана.'

    })

    setLocale('bg')

    const register = document.createElement('sa-register')

    register.setAttribute(
      'organization-id',
      '{{ org_id }}'
    )

    register.setAttribute(
      'sign-in',
      '/sign_in'
    )

    if (navigator.userAgent.includes('SolarAssistant')) {
      register.classList.add('embedded')
    }

    document
      .getElementById('sa-register-container')
      .appendChild(register)

  </script>

</body>
</html>
