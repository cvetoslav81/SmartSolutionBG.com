<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ org_name }}</title>

  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <style>
    :root {
      --sa-primary: {{ org_primary }};
      --sa-accent: {{ org_accent }};
    }
  </style>

  <script>
    try {
      localStorage.setItem('sa_locale', 'bg')
    } catch {}

    document.documentElement.lang = 'bg'

    if (navigator.userAgent.includes('SolarAssistant')) {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('embedded')
      })
    }
  </script>

</head>

<body>

  <header class="site-header hide-android">
    <div class="header-inner">

      <a class="header-logo" href="/sites">
        <img
          src="/assets/logo.svg"
          alt="{{ org_name }}"
        />
      </a>

      <nav class="header-nav">

        <a href="/sites">
          Моите системи
        </a>

        <a
          href="https://www.smartsolutionbg.com/solarassistant.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          SmartSolutionBG.com
        </a>

        <span
          class="header-separator"
          aria-hidden="true"
        ></span>

        <a
          class="header-account"
          href="/user"
          aria-label="Профил"
        >

          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 64 64"
            width="28"
            height="28"
          >

            <circle
              cx="32"
              cy="32"
              r="31"
              fill="var(--sa-accent)"
            />

            <path
              fill="var(--sa-primary)"
              d="M56.877,50.4748a31.0647,31.0647,0,0,0-49.7651-.0156,30.9669,30.9669,0,0,0,49.7651.0156Z"
            />

            <circle
              cx="32"
              cy="22"
              r="12"
              fill="var(--sa-primary)"
            />

          </svg>

        </a>

      </nav>

    </div>
  </header>


  <main>

    <div style="margin-bottom:28px">

      <h1 style="
        text-align:left;
        margin-bottom:6px;
      ">
        Моят профил
      </h1>

      <p style="
        margin:0;
        color:#6b7280;
        font-size:15px;
      ">
        Управление на вашия клиентски акаунт.
      </p>

    </div>


    <div id="sa-user-container"></div>

  </main>

      local_discovery_hotspot_hint:

      last_seen:

      invite:

      register_site:

      failed_register:

    })


    setLocale('bg')

    try {
      localStorage.setItem('sa_locale', 'bg')
    } catch {}


    /*
     * Създаваме профилния компонент
     * чак след българския речник.
     */
    const user = document.createElement('sa-user')

    user.setAttribute(
      'sign-in',
      '/sign_in'
    )


    if (navigator.userAgent.includes('SolarAssistant')) {
      user.classList.add('embedded')
    }


    document
      .getElementById('sa-user-container')
      .appendChild(user)


    /*
     * Повторно налагаме BG,
     * както направихме успешно при sites.html.
     */
    setTimeout(() => {

      try {
        localStorage.setItem('sa_locale', 'bg')
      } catch {}

      setLocale('bg')

    }, 500)

  </script>

</body>
</html>
