<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>{{ org_name }}</title>

  <link rel="stylesheet" href="/assets/style.css" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <!-- Цветове на организацията -->
  <style>
    :root {
      --sa-primary: {{ org_primary }};
      --sa-accent: {{ org_accent }};
    }
  </style>

  <!-- Auth transfer -->
  <script>
    if (/[?&]token=/.test(location.search) || /[#&]token=/.test(location.hash)) {
      document.documentElement.classList.add('auth-transfer')
    }
  </script>

  <!-- Embedded SolarAssistant app -->
  <script>
    if (navigator.userAgent.includes('SolarAssistant')) {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('embedded')

        document
          .querySelectorAll('sa-sign-in, sa-sites, sa-user')
          .forEach(el => el.classList.add('embedded'))
      })
    }
  </script>

</head>

<body>

  <header class="site-header hide-android">
    <div class="header-inner">

      <a class="header-logo" href="/sign_in">
        <img
          src="/assets/logo.svg"
          alt="{{ org_name }}"
        />
      </a>

    </div>
  </header>


  <main class="centered">

    <h1>Вход в клиентски портал</h1>


    <p style="
      margin-bottom:8px;
      font-size:15px;
      color:#6b7280;
      text-align:center;
    ">
      Мониторинг на вашата фотоволтаична система в реално време
    </p>


    <p style="
      margin-top:0;
      margin-bottom:20px;
      font-size:14px;
      text-align:center;
    ">

      <a
        href="https://www.smartsolutionbg.com/solarassistant.html"
        target="_blank"
        rel="noopener noreferrer"
        style="
          color:var(--sa-primary);
          text-decoration:none;
          font-weight:600;
        "
      >
        от SmartSolutionBG.com →
      </a>

    </p>


    <!--
      SolarAssistant login компонентът ще бъде
      създаден тук СЛЕД зареждането на BG превода.
    -->
    <div id="sa-login-container"></div>


    <p style="
      margin-top:16px;
      font-size:14px;
      color:#6b7280;
    ">
      Нямате акаунт?

      <a
        href="/register"
        style="
          color:var(--sa-primary);
          text-decoration:none;
        "
      >
        Създайте акаунт
      </a>

    </p>

  </main>


  <!--
    ВАЖНО:
    SolarAssistant се зарежда чак тук.
    След import добавяме българския речник,
    задаваме bg и чак след това създаваме
    <sa-sign-in>.
  -->

    /* =====================================================

      sites: 'Системи',

      send_reset_link:

      /* ---------- Нова парола ---------- */

      reset_your_password:

      activation_unaffected_generic:

      not_seeing_your_device:

      local_discovery_explainer:

      local_discovery_hotspot_hint:
        'Ако сте въвели име и парола за Wi-Fi в устройството, проверете дали то не е стартирало собствена Wi-Fi точка за достъп. Това означава, че не е успяло да се свърже към вашата мрежа.',

      last_seen:

      software_build:

      failed_load_site:

      /* ---------- Покана ---------- */

      invite:
        'Покани',


      /* ---------- Регистрация на система ---------- */

      register_site:
        'Регистрирай система',

      failed_register:
        'Системата не можа да бъде регистрирана.'

    })


    /* Задаваме български език */

    setLocale('bg')


    /* =====================================================
       СЪЗДАВАМЕ LOGIN КОМПОНЕНТА СЛЕД ПРЕВОДА
       ===================================================== */

    const login = document.createElement('sa-sign-in')

    login.setAttribute(
      'organization-id',
      '{{ org_id }}'
    )

    login.setAttribute(
      'return-to',
      '/sites'
    )


    /* Embedded режим */

    if (navigator.userAgent.includes('SolarAssistant')) {
      login.classList.add('embedded')
    }


    /* Поставяме login формата в страницата */

    document
      .getElementById('sa-login-container')
      .appendChild(login)

  </script>

</body>
</html>
